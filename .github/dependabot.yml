version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      # Group only minor + patch updates. Major bumps come as
      # individual PRs so each can be reviewed and tested in isolation.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      react-stack:
        patterns: ['react', 'react-dom', 'react-router-dom']
        update-types: [minor, patch]
    ignore:
      # Pin React 18 (BUILD_GUIDE §2 + ADR-0001). Revisit at Phase 9.
      - dependency-name: 'react'
        update-types: [version-update:semver-major]
      - dependency-name: 'react-dom'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      # Pin Tailwind 3 (Tailwind 4 is a different engine; revisit in Phase 8).
      - dependency-name: 'tailwindcss'
        update-types: [version-update:semver-major]
